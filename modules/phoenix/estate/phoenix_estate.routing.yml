phoenix_estate.collection:
  path: '/admin/phoenix/estates'
  defaults:
    _controller: '\Drupal\phoenix_estate\Controller\EstateCollectionController::collection'
    _title: 'Estates'
  requirements:
    _permission: 'access administration pages'

phoenix_estate.workspace:
  path: '/admin/phoenix/estate/{asset}'
  defaults:
    _controller: '\Drupal\phoenix_estate\Controller\EstateWorkspaceController::workspace'
    _title_callback: '\Drupal\phoenix_estate\Controller\EstateWorkspaceController::title'
  requirements:
    _permission: 'access administration pages'
    asset: '\d+'
  options:
    parameters:
      asset:
        type: entity:asset
